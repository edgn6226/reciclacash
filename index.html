<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReciclaCash</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b8f4d, #20c878);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 25px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 70px;
            margin-bottom: 10px;
        }

        h1 {
            color: #087a42;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #666;
            font-size: 17px;
            line-height: 1.5;
            margin-bottom: 35px;
        }

        .opcoes {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .botao {
            text-decoration: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 19px;
            font-weight: bold;
            transition: 0.3s;
            display: block;
        }

        .botao-app {
            background: #0b8f4d;
            color: white;
        }

        .botao-site {
            background: #e9f8f0;
            color: #087a42;
            border: 2px solid #0b8f4d;
        }

        .botao:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .descricao {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #777;
            font-size: 14px;
        }

        .rodape {
            margin-top: 20px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">♻️</div>

        <h1>ReciclaCash</h1>

        <p class="subtitulo">
            Recicle, contribua com o meio ambiente
            e transforme seus materiais recicláveis em valor.
        </p>

        <div class="opcoes">

            <a href="app/" class="botao botao-app">
                📱 Aplicativo
            </a>

            <a href="site/" class="botao botao-site">
                🌐 Site
            </a>

        </div>

        <p class="descricao">
            Escolha uma das opções acima para conhecer o ReciclaCash.
        </p>

        <p class="rodape">
            ♻️ ReciclaCash — Reciclar pode valer a pena.
        </p>

    </div>

</body>
</html>
